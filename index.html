<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FFR Field Force</title>
  
  <meta name="theme-color" content="#1565C0">
  <meta name="background-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FFR">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2331/2331966.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      background: #1565C0; 
      position: fixed;
      top: 0;
      left: 0;
    }
    iframe { 
      width: 100%; 
      height: 100vh; 
      border: none; 
      display: block; 
    }
    .loader { 
      position: fixed; 
      inset: 0; 
      background: linear-gradient(135deg, #1565C0, #0D47A1); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      color: white; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
      transition: opacity 0.5s;
    }
    .loader.hide { 
      opacity: 0;
      pointer-events: none;
    }
    .loader-box {
      text-align: center;
    }
    .spin { 
      width: 60px; 
      height: 60px; 
      border: 5px solid rgba(255,255,255,0.2); 
      border-top-color: white; 
      border-radius: 50%; 
      animation: rotate 0.8s linear infinite; 
      margin: 0 auto 20px; 
    }
    .app-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .app-tag {
      font-size: 12px;
      opacity: 0.8;
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="loader-box">
      <div class="spin"></div>
      <div class="app-name">FFR</div>
      <div class="app-tag">Field Force Reporting</div>
    </div>
  </div>
  
  <iframe 
    id="app" 
    src="https://script.google.com/macros/s/AKfycbyDwctOybdCMPoYCpSzt7aR5kt1ibdi2bglV6z1ublOsz41t_8Qd0V5Rccdp7_mC_rf5Q/exec" 
    allow="camera; microphone; geolocation *; fullscreen; autoplay; encrypted-media; picture-in-picture; display-capture; clipboard-read; clipboard-write; accelerometer; gyroscope; magnetometer"
    allowfullscreen
    allowtransparency>
  </iframe>
  
  <script>
    document.getElementById('app').onload = function() {
      setTimeout(function() {
        document.getElementById('loader').classList.add('hide');
        setTimeout(function() {
          document.getElementById('loader').style.display = 'none';
        }, 500);
      }, 2000);
    };
    
    // Hide loader after 8 seconds max
    setTimeout(function() {
      var l = document.getElementById('loader');
      if (l) {
        l.classList.add('hide');
        setTimeout(function() { l.style.display = 'none'; }, 500);
      }
    }, 8000);
  </script>
</body>
</html>
