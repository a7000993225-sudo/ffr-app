<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FFR Field Force</title>
  
  <meta name="theme-color" content="#1565C0">
  <meta name="background-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FFR">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://i.ibb.co/RGHyCZvv/logo.png">
  <link rel="apple-touch-icon" href="https://i.ibb.co/RGHyCZvv/logo.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; 
      height: 100vh; 
      overflow: hidden; 
      background: #1565C0; 
    }
    .loader { 
      position: fixed; 
      inset: 0; 
      background: linear-gradient(135deg, #1565C0, #0D47A1); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 9999; 
      color: white; 
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .spin { 
      width: 60px; 
      height: 60px; 
      border: 5px solid rgba(255,255,255,0.2); 
      border-top-color: white; 
      border-radius: 50%; 
      animation: rotate 0.8s linear infinite; 
      margin: 0 auto 20px; 
    }
    @keyframes rotate { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div style="text-align:center;">
      <div class="spin"></div>
      <div style="font-size:24px;font-weight:700;">FFR</div>
      <div style="font-size:12px;opacity:0.8;">Field Force Reporting</div>
    </div>
  </div>
  
  <script>
    // Direct redirect to Apps Script — no iframe
    window.location.replace("https://script.google.com/macros/s/AKfycbyDwctOybdCMPoYCpSzt7aR5kt1ibdi2bglV6z1ublOsz41t_8Qd0V5Rccdp7_mC_rf5Q/exec");
  </script>
</body>
</html>
